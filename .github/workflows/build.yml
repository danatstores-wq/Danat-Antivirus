name: Build Danat Anti-Virus

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build Release
        run: msbuild DanatAntiVirus.sln /m /p:Configuration=Release /p:Platform="Any CPU"
      - name: Upload preview executable
        uses: actions/upload-artifact@v4
        with:
          name: DanatAntiVirus-preview
          path: src/DanatAntiVirus/bin/Release/DanatAntiVirus.exe
