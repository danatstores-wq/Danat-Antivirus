name: Windows desktop build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        shell: pwsh
        run: msbuild .\DanatAntiVirus.sln /m /p:Configuration=Release '/p:Platform=Any CPU' /verbosity:minimal

      - name: Publish build output
        uses: actions/upload-artifact@v4
        with:
          name: DanatAntiVirus-preview
          path: src/DanatAntiVirus/bin/Release/DanatAntiVirus.exe
          if-no-files-found: error
          retention-days: 14
